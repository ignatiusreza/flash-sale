# Local stack for development and integration tests.
#
# A single RabbitMQ node: production runs a three-node quorum cluster
# (docs/PLAN.md §5.1), which is a documented decision rather than something
# the reviewer should have to wait for on first run.
#
# Every service is pinned to UTC. Postgres additionally sets its own timezone,
# because TZ alone does not govern the server's `timezone` setting and
# docs/PLAN.md §9.1 requires both.

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: flashsale
      POSTGRES_PASSWORD: flashsale
      POSTGRES_DB: flashsale
      TZ: UTC
      PGTZ: UTC
    command: ['postgres', '-c', 'timezone=UTC']
    # Published on a non-default host port so it cannot clash with a Postgres
    # already running on 5432, and overridable if even this one is taken.
    #
    # Deliberately NOT an ephemeral `- '5432'`: Zed's dev-container support
    # parses `docker compose config` with a deserializer that requires a
    # `published` field on every port, and an unpublished port omits it, so the
    # container fails to start with a YAML deserialization error.
    #
    # Nothing inside the network uses this mapping anyway — the `runner`
    # service and the devcontainer reach it as `postgres:5432`.
    ports:
      - '${POSTGRES_PORT:-15432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flashsale -d flashsale']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: flashsale
      RABBITMQ_DEFAULT_PASS: flashsale
      TZ: UTC
    # Non-default host ports, as above. 25672 is deliberately avoided: that is
    # RabbitMQ's own Erlang distribution port and a host RabbitMQ holds it.
    ports:
      - '${RABBITMQ_PORT:-15673}:5672'
      - '${RABBITMQ_UI_PORT:-15674}:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 5s
      timeout: 10s
      retries: 20
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  # Runs the gates inside the network, reaching the services by name. Behind a
  # profile so `docker compose up` does not start it:
  #   docker compose run --rm runner            # the whole verify gate
  #   docker compose run --rm runner pnpm test  # or any other script
  runner:
    profiles: ['tools']
    build:
      context: .
      target: test
    environment:
      TZ: UTC
      DATABASE_URL: postgres://flashsale:flashsale@postgres:5432/flashsale
      RABBITMQ_URL: amqp://flashsale:flashsale@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-data:
  rabbitmq-data:
