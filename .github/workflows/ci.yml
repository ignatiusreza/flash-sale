name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  verify:
    runs-on: ubuntu-latest

    # Without these the integration tests — including the two invariant tests
    # that are the whole point of the exercise — would silently skip in CI.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: flashsale
          POSTGRES_PASSWORD: flashsale
          POSTGRES_DB: flashsale
          TZ: UTC
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flashsale -d flashsale"
          --health-interval 2s --health-timeout 3s --health-retries 30
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: flashsale
          RABBITMQ_DEFAULT_PASS: flashsale
          TZ: UTC
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 5s --health-timeout 10s --health-retries 30

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Run the suite twice. A suite that only passes in UTC cannot catch code
      # that depends on the process's local zone — see docs/PLAN.md §9.1, §11.
      - name: Test (UTC)
        run: pnpm test
        env:
          TZ: UTC
          DATABASE_URL: postgres://flashsale:flashsale@localhost:5432/flashsale
          RABBITMQ_URL: amqp://flashsale:flashsale@localhost:5672

      - name: Test (non-UTC)
        run: pnpm test
        env:
          TZ: America/St_Johns
          DATABASE_URL: postgres://flashsale:flashsale@localhost:5432/flashsale
          RABBITMQ_URL: amqp://flashsale:flashsale@localhost:5672

      - name: Licences
        run: pnpm licenses:check

      - name: Audit
        run: pnpm audit --audit-level=high
